[project]
name = "thinkbible-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
# backend/ is added back by spec 003 (compare + authorizer Lambdas).
members = ["shared", "pipeline"]

[tool.uv.sources]
thinkbible-core = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "moto[s3,cloudfront]>=5",
  "jsonschema>=4.23",
  "pre-commit>=3.8",
  "boto3-stubs[s3,cloudfront]>=1.35",
  "types-jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Spec Kit's bundled scripts are vendored tooling, not project code.
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["thinkbible_core", "thinkbible_pipeline"]

[tool.mypy]
python_version = "3.12"
strict = true
# thinkbible_api is added back by spec 003.
packages = ["thinkbible_core", "thinkbible_pipeline"]
mypy_path = "shared/src:pipeline/src"

[tool.pytest.ini_options]
testpaths = ["shared/tests", "pipeline/tests"]
# importlib mode lets shared/ and pipeline/ tests share file names without __init__.py packages.
addopts = "--import-mode=importlib"
