[project]
name = "thinkbible-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["shared", "backend", "pipeline"]

[tool.uv.sources]
thinkbible-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "moto[dynamodb,s3]>=5", "jsonschema>=4.23", "pre-commit>=3.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["thinkbible_core", "thinkbible_api", "thinkbible_pipeline"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "backend/tests", "pipeline/tests"]
