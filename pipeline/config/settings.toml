# Pipeline settings (research R6, R7, R15).
#
# Models: the Claude 5.5 models on the Claude API directly (default since 2026-11-18). Bedrock's 5.5
# quota is still 0 for this account; [profiles.bedrock] below keeps the Claude 4.x setup on Bedrock
# (`THINKBIBLE_PROFILE=bedrock`). The API key is the SSM SecureString `anthropic-api-key`, read at
# run time with the caller's AWS credentials (ANTHROPIC_API_KEY wins). Refusals fall back
# server-side. When Bedrock opens 5.5, the bedrock profile only needs its model IDs changed.

region = "us-west-2"
endpoint = "anthropic"  # "anthropic" (Claude API), "runtime" (bedrock-runtime), "mantle"
api_key_parameter = "anthropic-api-key"
# A new Claude API account starts with low per-minute limits: keep in step with max_concurrency
# in infra/main.tf (tests/unit/test_infra_sync.py checks it).
concurrency = 3
excerpt_cap_tokens = 8000
review_flag_threshold = 2
# Non-streaming requests: keep max_tokens at about 16k so responses finish inside SDK timeouts.
max_tokens = 16000
# Structured output that fails validation is retried this many times, then the section fails.
invalid_output_retries = 2
# Throttled requests (429) are retried this many times, waiting 10s, 20s, 40s, then 60s.
throttle_retries = 8
# Only the Bedrock endpoints use this (client-side refusal fallback); the Claude API falls back
# server-side.
refusal_fallback_model = "claude-opus-5"

[gate]
min_idea_pass_rate = 0.90
min_question_pass_rate = 0.80
min_agreement = 0.85
min_calibration_items = 30

[prompts]
shared_context = "v1"
question_guide = "v4"  # v4 (2026-11-17): the owner's favorites; deeper meaning (approved, not a draft)

# Per stage: model; thinking ("adaptive" or "none"); effort (output_config.effort); prompt
# version; the default cost per section used until the run records have history; and pacing.
[stages.intro]
# The book introduction: written once per book from the commentators' prefaces, graded by the
# review model (prompts/intro, prompts/intro-review). Runs on the book's first section only.
model = "claude-sonnet-5-5"
thinking = "adaptive"
effort = "high"
prompt = "v1"
default_cost_usd = 0.15
requests_per_minute = 4

[stages.summaries]
model = "claude-haiku-5-5"
thinking = "adaptive"
effort = "low"
prompt = "v1"
default_cost_usd = 0.002
requests_per_minute = 10

[stages.generate]
model = "claude-sonnet-5-5"
thinking = "adaptive"
effort = "high"
prompt = "v13"  # extract/v13: section context notes (the book has its own introduction); questions/v13 = v12
default_cost_usd = 0.12  # measured on 10 Mark sections with Sonnet 5.5 (2026-11-18)
requests_per_minute = 4

[stages.align]
model = "claude-haiku-5-5"
thinking = "adaptive"
effort = "low"
prompt = "v1"
default_cost_usd = 0.002
requests_per_minute = 10

[stages.review]
# The quality gate's grader: a stronger model than the generator (research R16). Calibrated:
# Opus 5.5 with review/v9 agrees with the owner on 92% of 36 held-out ratings (2026-11-18).
model = "claude-opus-5-5"
thinking = "adaptive"
effort = "high"
prompt = "v9"  # v9: purpose-first question rubric; the owner's round 1 verdicts as examples
default_cost_usd = 0.12  # measured on 9 Mark sections with Opus 5.5 (2026-11-18)
requests_per_minute = 4


# Claude 4.x on Amazon Bedrock (bedrock-runtime, US cross-region inference profiles), the setup
# used until 2026-11-18. When Bedrock opens the 5.5 models for this account, change these model
# IDs, add them to `bedrock_models` in infra/main.tf, and re-apply. This account can't use
# `bedrock-mantle` (research R6).
[profiles.bedrock]
endpoint = "runtime"
concurrency = 10
throttle_retries = 5
refusal_fallback_model = "us.anthropic.claude-opus-4-6-v1"

[profiles.bedrock.stages.intro]
model = "us.anthropic.claude-sonnet-4-6"
effort = "medium"
requests_per_minute = 10

[profiles.bedrock.stages.summaries]
model = "us.anthropic.claude-haiku-4-5-20251001-v1:0"
thinking = "none"
effort = ""  # Haiku 4.5 rejects an effort setting
default_cost_usd = 0.02
requests_per_minute = 10  # this account's Bedrock quota for the model

[profiles.bedrock.stages.generate]
model = "us.anthropic.claude-sonnet-4-6"
effort = "medium"
default_cost_usd = 0.22
requests_per_minute = 10

[profiles.bedrock.stages.align]
model = "us.anthropic.claude-haiku-4-5-20251001-v1:0"
thinking = "none"
effort = ""
default_cost_usd = 0.02
requests_per_minute = 10

[profiles.bedrock.stages.review]
model = "us.anthropic.claude-opus-4-6-v1"
effort = "medium"
default_cost_usd = 0.10
requests_per_minute = 5
