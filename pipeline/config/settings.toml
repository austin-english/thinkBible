# Pipeline settings (research R6, R7, R15).
#
# Models run on Amazon Bedrock's `bedrock-runtime` endpoint (AWS's recommendation for new
# applications; this account can't use `bedrock-mantle`, research R6). Model IDs are US
# cross-region inference profiles.
#
# 2026-11-12: the Claude 5.5 models are blocked for this account (quota 0, "account history"), so
# the stages run on Claude 4.x for now. When 5.5 opens up, change the models here (Haiku 5.5:
# effort "low", Sonnet/Opus 5.5: effort "medium"; thinking is always on for 5.5), add them to
# `bedrock_models` in infra/envs/*/main.tf, and re-apply.

region = "us-west-2"
endpoint = "runtime"  # "runtime" (bedrock-runtime) or "mantle" (bedrock-mantle)
concurrency = 10
excerpt_cap_tokens = 8000
review_flag_threshold = 2
# Non-streaming requests: keep max_tokens at about 16k so responses finish inside SDK timeouts.
max_tokens = 16000
# Structured output that fails validation is retried this many times, then the section fails.
invalid_output_retries = 2
# Client-side refusal fallback (Bedrock has no server-side `fallbacks`): one retry on this model.
refusal_fallback_model = "us.anthropic.claude-opus-4-6-v1"

[prompts]
shared_context = "v1"
question_guide = "v1"

# Per stage: model; thinking ("adaptive" or "none"); effort (output_config.effort, omit for
# models that don't accept it, such as Haiku 4.5); prompt version; and the default cost per
# section used until the run records have history (estimates for the 4.x models).
[stages.summaries]
model = "us.anthropic.claude-haiku-4-5-20251001-v1:0"
thinking = "none"
prompt = "v1"
default_cost_usd = 0.02

[stages.generate]
model = "us.anthropic.claude-sonnet-4-6"
thinking = "adaptive"
effort = "medium"
prompt = "v1"
default_cost_usd = 0.09

[stages.align]
model = "us.anthropic.claude-haiku-4-5-20251001-v1:0"
thinking = "none"
prompt = "v1"
default_cost_usd = 0.02

[stages.review]
# The quality gate's grader: a stronger model than the generator (research R16).
model = "us.anthropic.claude-opus-4-6-v1"
thinking = "adaptive"
effort = "medium"
prompt = "v1"
default_cost_usd = 0.08

[stages.levels]
model = "us.anthropic.claude-haiku-4-5-20251001-v1:0"
thinking = "none"
prompt = "v1"
default_cost_usd = 0.05
