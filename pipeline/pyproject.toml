[project]
name = "thinkbible-pipeline"
version = "0.1.0"
description = "ThinkBible batch content pipeline: frozen sources to reviewed, versioned content packs"
requires-python = ">=3.12"
dependencies = [
  "thinkbible-core",
  "anthropic[bedrock]>=0.70",
  "boto3>=1.35",
  "typer>=0.12",
  "jinja2>=3.1",
  "pydantic>=2.9",
]

[project.scripts]
thinkbible-pipeline = "thinkbible_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thinkbible_pipeline"]
