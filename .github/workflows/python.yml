name: python

on:
  # Gate for merging: runs when a PR is opened and on every push to it (open a draft PR for early feedback).
  pull_request:
  # Confirm main is green after each merge.
  push:
    branches: [main]
  # "Run workflow" button in the Actions tab.
  workflow_dispatch:

# A newer push to the same PR/branch cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # No AWS credentials and no model calls in CI.
      - run: make bootstrap
      - run: make lint
      - run: make test
